<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grad)"/>

  <!-- Logo/Brand -->
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="120" font-weight="bold" text-anchor="middle" fill="white">Page One</text>

  <!-- Tagline -->
  <text x="600" y="350" font-family="Arial, sans-serif" font-size="36" text-anchor="middle" fill="white" opacity="0.9">Premium Solutions for Success</text>

  <!-- Website URL -->
  <text x="600" y="500" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="white" opacity="0.7">www.example.com</text>
</svg>